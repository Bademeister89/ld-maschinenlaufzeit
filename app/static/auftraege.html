<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aufträge</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a1a19">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><img class="brand-icon" src="icons/icon.svg" alt="" width="24" height="24">LD Maschinenlaufzeit</div>
      <nav class="nav" aria-label="Seiten">
        <a href="./">Live</a>
        <a href="auswertung.html">Auswertung</a>
        <a href="auftraege.html" aria-current="page">Aufträge</a>
        <a href="werkzeuge.html">Werkzeugauswertung</a>
        <a href="konfiguration.html">Konfiguration</a>
      </nav>
      <div class="topbar-status">
        <span id="sim" class="sim-badge" hidden>Simulation – keine echten Maschinendaten</span>
      </div>
    </div>
  </header>

  <main>
    <div id="banner" class="banner error" hidden></div>

    <div class="card filters" role="group" aria-label="Filter">
      <div class="segmented" id="status" role="group" aria-label="Status">
        <button type="button" data-status="open">Offen</button>
        <button type="button" data-status="closed">Abgeschlossen</button>
        <button type="button" data-status="all">Alle</button>
      </div>
      <label class="field">Suche
        <input type="search" id="search" placeholder="Auftragsnummer oder Bezeichnung" autocomplete="off">
      </label>
      <span class="spacer"></span>
      <span class="muted" id="count"></span>
    </div>

    <section class="section card">
      <div class="section-head">
        <h2>Aufträge</h2>
        <p class="muted">Werden automatisch angelegt, sobald ein Programm nach dem Schema
          <span class="num">JJ-Auftrag-Aufspannung-Programm</span> (z. B. 26-21055-01-01) an einer Maschine auftaucht.</p>
      </div>
      <div class="table-wrap" id="orders"></div>
    </section>

    <section class="section" id="detail" hidden></section>

    <!-- Bild zum Auftrag: Die Felder bleiben beim Neuzeichnen des Details bestehen, damit die Auswahl
         nicht verloren geht. Galerie bzw. Datei ohne "capture"; die Kamera braucht ein eigenes Feld,
         weil Android bei Bild-Dateifeldern sonst nur die Fotoauswahl zeigt. -->
    <input type="file" id="image-input" class="visually-hidden" accept="image/*" tabindex="-1" aria-hidden="true">
    <input type="file" id="camera-input" class="visually-hidden" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  </main>

  <script type="module" src="auftraege.js"></script>
</body>
</html>
