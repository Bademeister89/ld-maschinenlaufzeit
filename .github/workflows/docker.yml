# Tests ausführen und das Docker-Image nach ghcr.io/<owner>/ld-maschinenlaufzeit hochladen.
# Tags: latest (Branch main), Versionen (Git-Tags v1.2.3 → 1.2.3 und 1.2), sha-<commit>.
# Freigabe einer Version: Nummer in app/__init__.py und CHANGELOG.md, dann Git-Tag v<Nummer> pushen.
name: Tests und Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: version
        # number: Versionsnummer aus app/__init__.py; build: z. B. 2026-09-28-a10b987
        run: |
          number=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__init__.py)
          test -n "$number" || { echo "::error::__version__ in app/__init__.py nicht gefunden"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$number" ]]; then
            echo "::error::Git-Tag $GITHUB_REF_NAME passt nicht zur Version $number in app/__init__.py"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action schreibt den Namen klein (ghcr.io verlangt Kleinbuchstaben)
          images: ghcr.io/${{ github.repository_owner }}/ld-maschinenlaufzeit
          # latest nur aus main (Regel unten) – sonst setzt jeder Versions-Tag latest mit, und bei
          # mehreren gleichzeitig gepushten Tags gewinnt der Build, der zuletzt fertig wird
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: org.opencontainers.image.version=${{ steps.version.outputs.number }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD=${{ steps.version.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
